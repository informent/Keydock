name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  api:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm audit --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ./sdk/python
      - run: python -m unittest discover -s sdk/python -p test_keydock.py -v
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: node scripts/ui-smoke.mjs
      - run: node scripts/ui-experience-smoke.mjs
      - run: node scripts/ui-customers-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: console-screenshots
          path: docs/images/
          retention-days: 7
